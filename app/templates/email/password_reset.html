{% extends "_base.html" %}
{% block content %}
<p>Hello {{ full_name }},</p>
<p>We received a request to reset your password.</p>
<p><a href="{{ link }}" style="display:inline-block;background:#111;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none;">Choose a new password</a></p>
<p style="font-size:13px;color:#555;">The link expires in {{ expires_minutes }} minutes and can be used once. If you did not request this, your password stays the same.</p>
{% endblock %}

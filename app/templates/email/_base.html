<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f5f5f5;font-family:Arial,Helvetica,sans-serif;color:#111;">
  <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#fff;border-radius:12px;padding:32px;">
    <tr><td>
      <p style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#00a347;margin:0 0 16px;">{{ app_name }}</p>
      {% block content %}{% endblock %}
      <p style="font-size:12px;color:#777;margin-top:32px;">If you did not expect this email, you can ignore it.</p>
    </td></tr>
  </table>
</body>
</html>
